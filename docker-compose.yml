version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: patentmind-postgres
    environment:
      POSTGRES_USER: patentuser
      POSTGRES_PASSWORD: patentpass
      POSTGRES_DB: patentmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patentuser -d patentmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: patentmind-neo4j
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  patentmind-api:
    build:
      context: ./patentmind
      dockerfile: Dockerfile
    container_name: patentmind-api
    ports:
      - "8000:8000"
    env_file:
      - ./patentmind/.env
    environment:
      - DATABASE_URL=postgresql://patentuser:patentpass@postgres:5432/patentmind_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=patentpassword
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
