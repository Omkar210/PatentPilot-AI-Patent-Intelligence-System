
services:
  # ──────────────────────────────────────────
  # PostgreSQL — primary relational store
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: patentpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patentpilot
      POSTGRES_USER: patentpilot
      POSTGRES_PASSWORD: patentpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patentpilot -d patentpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Neo4j Community — knowledge graph
  # ──────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: patentpilot_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/patentpilot123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # Browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt driver → bolt://localhost:7687
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ──────────────────────────────────────────
  # NOTE: ChromaDB runs as an EMBEDDED Python client
  # (chromadb.PersistentClient) — no Docker service needed.
  # Data is persisted to ./chroma_data on the host via CHROMA_PERSIST_PATH.
  # ──────────────────────────────────────────

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
